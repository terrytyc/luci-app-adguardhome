name: Publish signed APK feed

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (startsWith(github.event.release.tag_name, 'v3.') &&
           github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    outputs:
      current: ${{ steps.releases.outputs.current }}
    steps:
      - name: Select current stable v3 release
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }

          release_list=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v3."))) | .tag_name' | sort -Vr) ||
            die 'unable to list releases'
          mapfile -t stable_tags < <(printf '%s' "$release_list")

          current=${stable_tags[0]:-}
          [[ $current =~ ^v3\.[0-9A-Za-z.+_~-]+$ ]] ||
            die "not a stable v3 release tag: $current"

          if [[ -n $REQUESTED_TAG && $REQUESTED_TAG != "$current" ]]; then
            printf 'Skipping old release %s; latest stable release is %s\n' "$REQUESTED_TAG" "$current"
            exit 0
          fi
          printf 'current=%s\n' "$current" >>"$GITHUB_OUTPUT"

      - name: Require passing tests for release commit
        if: steps.releases.outputs.current != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.releases.outputs.current }}
        run: |
          set -Eeuo pipefail
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CURRENT_TAG" --jq .sha)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Unable to resolve release commit: %s\n' "$CURRENT_TAG" >&2
            exit 1
          }
          run_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$commit&event=push&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .id')
          [[ $run_id =~ ^[0-9]+$ ]] || {
            printf 'Release %s has no passing Test run for %s.\n' "$CURRENT_TAG" "$commit" >&2
            exit 1
          }
          conclusion=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            --jq '.jobs[] | select(.name == "full") | .conclusion')
          [[ $conclusion == success ]] || {
            printf 'Release %s has no passing full test job (status: %s).\n' \
              "$CURRENT_TAG" "${conclusion:-missing}" >&2
            exit 1
          }

      - name: Check out selected release
        if: steps.releases.outputs.current != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.releases.outputs.current }}
          persist-credentials: false

      - name: Download release APKs
        if: steps.releases.outputs.current != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.releases.outputs.current }}
        run: |
          set -Eeuo pipefail
          mkdir -p release/current
          gh release download "$CURRENT_TAG" --dir release/current \
            --pattern 'luci-app-adguardhome-*.apk' \
            --pattern 'luci-i18n-adguardhome-zh-cn-*.apk'

      - name: Build and verify signed feed
        if: steps.releases.outputs.current != ''
        shell: bash
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
          CURRENT_TAG: ${{ steps.releases.outputs.current }}
        run: |
          set -Eeuo pipefail
          mkdir -p site
          cp keys/public-key.pem site/public-key.pem
          docker run --rm \
            -e APK_SIGNING_KEY_B64 \
            -e CURRENT_TAG \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.23@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40 sh -ec '
              apk add --no-cache openssl=3.5.8-r0
              exec sh scripts/publish-feed.sh /sbin/apk keys/public-key.pem \
                "$CURRENT_TAG" release/current site/packages
            '

      - name: Configure GitHub Pages
        if: steps.releases.outputs.current != ''
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: steps.releases.outputs.current != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.current != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
