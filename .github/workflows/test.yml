name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox python3-yaml

      - name: Run root-private state tests without an SDK
        run: |
          mkdir -p "$RUNNER_TEMP/luci-test-bin"
          ln -s "$(command -v busybox)" "$RUNNER_TEMP/luci-test-bin/awk"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo env "PATH=$RUNNER_TEMP/luci-test-bin:$PATH" bash scripts/test.sh --light
